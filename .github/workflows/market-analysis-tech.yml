name: Tech Market Analysis

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/10 * * * *' # Every 10 minutes (Tech news is slower than Vahid)
  workflow_dispatch:

concurrency:
  group: market-analysis-tech
  cancel-in-progress: true

jobs:
  analyze-tech:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Tech Market Analysis
        id: analyze
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION_TECH }}
        run: |
          python3 backend/main.py --channels config.txt --output ../market_data_tech.json --limit 50 --max-duration 300
          
          # Prepare 'public' directory for Pages
          mkdir -p public
          mv market_data_tech.json public/
          
          # Move media if it exists
          if [ -d "media" ]; then
             echo "🧹 Pruning old cache..."
             find media -type f -mtime +1 -delete || true
             mv media public/
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
